<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Les parcours de la SaintéLyon</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height:100%; width:100%; margin:0; padding:0; overflow:hidden; background:transparent; }
    #sl {
      --blue:#0068B1; --blue-dk:#004f87; --blue-lt:#e8f3fb; --red:#c0392b;
      --green:#1B5E20; --amber:#F9A825; --gray:#9E9E9E;
      --bg:#fff; --border:#e2e5e8; --border-lt:#eeeff1;
      --text:#1a1a1a; --muted:#6b7280;
      --font:'Merriweather Sans', sans-serif;
      --shadow-sm:0 1px 4px rgba(0,0,0,0.07);
      font-family:var(--font); color:var(--text);
      width:100%; height:100%;
      display:flex; flex-direction:column;
      background:var(--bg); overflow:hidden;
    }

    /* HEADER */
    #sl .sl-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px 9px; border-bottom:1px solid var(--border);
      background:var(--bg); flex-shrink:0; gap:10px;
    }
    #sl .sl-header-left { flex:1; min-width:0; }
    #sl h1 { margin:0; font-size:15px; font-weight:700; color:var(--text); line-height:1.25;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #sl .sl-subtitle { font-size:10px; color:var(--muted); margin-top:2px; font-weight:300;
                       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* CONTROLS */
    #sl .sl-controls {
      padding:8px 14px 7px; background:var(--bg);
      border-bottom:1px solid var(--border); flex-shrink:0;
    }
    #sl .sl-label {
      display:block; font-size:9.5px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:0.8px; margin-bottom:5px;
    }
    #sl .sl-routes { display:flex; flex-wrap:wrap; gap:4px; }
    #sl .sl-route {
      padding:6px 10px; font-size:10.5px; font-weight:700;
      border:1px solid var(--border); border-radius:2px; color:var(--muted);
      cursor:pointer; transition:all 0.13s; user-select:none; white-space:nowrap;
      background:var(--bg); font-family:var(--font);
      display:inline-flex; align-items:center; gap:5px;
    }
    #sl .sl-route:hover {
      border-color:var(--route-color, var(--blue));
      color:var(--route-color, var(--blue));
    }
    #sl .sl-route.active {
      background:var(--route-color, var(--blue));
      color:#fff;
      border-color:var(--route-color, var(--blue));
    }
    #sl .sl-route-dot {
      width:7px; height:7px; border-radius:50%;
      background:var(--route-color, var(--blue)); flex-shrink:0;
    }
    #sl .sl-route.active .sl-route-dot { background:#fff; }

    /* MAP */
    #sl .sl-map-wrap { position:relative; flex:1; min-height:0; z-index:1; }
    #sl #sl-map { width:100%; height:100%; }

    #sl .sl-overlay {
      position:absolute; inset:0; background:rgba(255,255,255,0.95);
      z-index:1000; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:10px; font-size:13px; color:var(--muted);
      opacity:0; pointer-events:none; transition:opacity 0.22s;
      text-align:center; padding:20px;
    }
    #sl .sl-overlay.active { opacity:1; pointer-events:all; }
    .sl-spinner {
      width:22px; height:22px; border:2px solid var(--border);
      border-top-color:var(--blue); border-radius:50%;
      animation:sl-spin 0.75s linear infinite;
    }
    @keyframes sl-spin { to { transform:rotate(360deg); } }

    /* ELEVATION */
    #sl .sl-elev-wrap {
      flex-shrink:0; background:var(--bg); border-top:1px solid var(--border);
      position:relative; height:100px;
    }
    #sl #sl-elev-svg {
      display:block; width:100%; height:100%; cursor:crosshair; touch-action:none;
    }
    #sl .sl-elev-empty {
      position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; font-size:11px; color:var(--muted); background:var(--bg);
    }

    /* STATS */
    #sl .sl-stats {
      padding:7px 14px; background:var(--bg); border-top:1px solid var(--border);
      flex-shrink:0; display:grid; grid-template-columns:repeat(4,1fr); gap:0;
    }
    #sl .sl-stat {
      padding:5px 8px 5px 0; display:flex; flex-direction:column; gap:1px;
      border-right:1px solid var(--border-lt);
    }
    #sl .sl-stat:last-child { border-right:none; }
    #sl .sl-stat:not(:first-child) { padding-left:10px; }
    #sl .sl-stat-label { font-size:8.5px; font-weight:700; color:var(--muted); text-transform:uppercase; }
    #sl .sl-stat-value { font-size:13.5px; font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums; line-height:1.1; }
    #sl .sl-stat-sub { font-size:8.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }

    /* FOOTER */
    #sl footer {
      padding:4px 14px; background:var(--bg); border-top:1px solid var(--border-lt);
      display:flex; justify-content:space-between; align-items:center;
      font-size:9px; color:#b0b5bc; flex-shrink:0;
    }
    #sl footer a { color:#b0b5bc; text-decoration:none; }
    #sl footer a:hover { color:var(--blue); }

    /* LEAFLET TOOLTIPS */
    .leaflet-tooltip {
      font-family:var(--font) !important; font-size:10px !important;
      font-weight:700 !important; background:#fff !important;
      border:1px solid var(--border) !important; border-radius:2px !important;
      box-shadow:0 1px 4px rgba(0,0,0,0.1) !important;
      padding:3px 7px !important; color:var(--text) !important;
    }
    .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before { display:none; }

    /* RESPONSIVE */
    @media (max-width:540px) {
      #sl .sl-route { font-size:10px; padding:5px 8px; }
      #sl .sl-elev-wrap { height:80px; }
    }
    @media (max-width:440px) {
      #sl .sl-stats { grid-template-columns:repeat(2,1fr); }
      #sl .sl-stat:nth-child(2n) { border-right:none; }
      #sl .sl-stat:nth-child(odd) { padding-left:0; }
      #sl .sl-stat:nth-child(n+3) { border-top:1px solid var(--border-lt); padding-top:6px; margin-top:2px; }
    }
  </style>
</head>
<body>
<div id="sl">

  <div class="sl-header">
    <div class="sl-header-left">
      <h1 id="sl-title">Les parcours de la SaintéLyon</h1>
      <div class="sl-subtitle" id="sl-subtitle">Chargement…</div>
    </div>
  </div>

  <div class="sl-controls">
    <label class="sl-label">Choisir un parcours</label>
    <div class="sl-routes" id="sl-routes"></div>
  </div>

  <div class="sl-map-wrap">
    <div id="sl-map"></div>

    <div class="sl-overlay active" id="sl-loader">
      <div class="sl-spinner"></div>
      <span>Récupération des données…</span>
    </div>
    <div class="sl-overlay" id="sl-error">
      <div style="font-weight:700; color:#c0392b; margin-bottom:3px; font-size:13px">Erreur de chargement</div>
      <div style="font-size:11px; font-weight:300" id="sl-error-msg">Impossible de récupérer le fichier GPX.</div>
    </div>
  </div>

  <div class="sl-elev-wrap" id="sl-elev-wrap">
    <svg id="sl-elev-svg"></svg>
    <div class="sl-elev-empty" id="sl-elev-empty" style="display:none">Profil altimétrique indisponible</div>
  </div>

  <div class="sl-stats">
    <div class="sl-stat">
      <div class="sl-stat-label">Distance</div>
      <div class="sl-stat-value" id="stat-dist">—</div>
      <div class="sl-stat-sub">kilomètres</div>
    </div>
    <div class="sl-stat">
      <div class="sl-stat-label">Dénivelé +</div>
      <div class="sl-stat-value" id="stat-dplus">—</div>
      <div class="sl-stat-sub">mètres</div>
    </div>
    <div class="sl-stat">
      <div class="sl-stat-label">Alt. max</div>
      <div class="sl-stat-value" id="stat-altmax">—</div>
      <div class="sl-stat-sub" id="stat-altmax-sub">point culminant</div>
    </div>
    <div class="sl-stat">
      <div class="sl-stat-label">Alt. min</div>
      <div class="sl-stat-value" id="stat-altmin">—</div>
      <div class="sl-stat-sub">point bas</div>
    </div>
  </div>

  <footer>
    <span>v1.0</span>
    <span>Source : <a href="https://saintelyon.com" target="_blank" rel="noopener">saintelyon.com</a></span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* ==============================================================
     ⚙️ CONFIG
  ============================================================== */
  const CONFIG = {
    baseUrl: 'https://raw.githubusercontent.com/lucasbe-lpr/saintelyon2026/main/routes/',
    routes: [
      { id: 'lyonsaintelyon', name: 'LyonSaintéLyon', color: '#977FE7', files: ['ALLER LYONSAINTÉLYON.gpx', 'RETOUR LYONSAINTÉLYON.gpx'] },
      { id: 'saintelyon',     name: 'SaintéLyon',     color: '#EB3140', files: ['SAINTÉLYON.gpx'] },
      { id: 'saintexpress',   name: 'SaintExpress',   color: '#F8772B', files: ['SAINTEXPRESS.gpx'] },
      { id: 'saintevia',      name: 'SaintéVia',      color: '#383838', files: ['SAINTÉVIA.gpx'] },
      { id: 'saintesprint',   name: 'SaintéSprint',   color: '#2189DC', files: ['SAINTÉSPRINT.gpx'] },
      { id: 'saintetic',      name: 'SaintéTic',      color: '#34CD2B', files: ['SAINTÉTIC.gpx'] }
    ]
  };

  const state = {
    map: null, activeId: null, cache: {},
    layers: { polyline: null, start: null, end: null, hover: null },
    currentData: null
  };
  const $ = id => document.getElementById(id);

  /* ---------- utils ---------- */
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, toRad = Math.PI / 180;
    const dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function smooth(values, window) {
    const half = Math.floor(window / 2), out = new Array(values.length);
    for (let i = 0; i < values.length; i++) {
      let sum = 0, n = 0;
      for (let j = Math.max(0, i-half); j <= Math.min(values.length-1, i+half); j++) {
        const v = values[j];
        if (v != null && isFinite(v)) { sum += v; n++; }
      }
      out[i] = n ? sum / n : null;
    }
    return out;
  }
  function fmt(n, d) {
    if (n == null || !isFinite(n)) return '—';
    return n.toLocaleString('fr-FR', { minimumFractionDigits: d||0, maximumFractionDigits: d||0 });
  }

  /* ---------- GPX ---------- */
  function parseGPX(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('Fichier GPX invalide');
    const nsGet = (parent, tag) => {
      let els = parent.getElementsByTagNameNS('*', tag);
      if (!els.length) els = parent.getElementsByTagName(tag);
      return Array.from(els);
    };
    let nodes = nsGet(doc, 'trkpt');
    if (!nodes.length) nodes = nsGet(doc, 'rtept');
    const points = [];
    for (const pt of nodes) {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      if (!isFinite(lat) || !isFinite(lon)) continue;
      const eleEl = nsGet(pt, 'ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      points.push({ lat, lon, ele: isFinite(ele) ? ele : null });
    }
    if (!points.length) throw new Error('Aucun point dans le GPX');
    return points;
  }

  /* ---------- compute ---------- */
  function computeRouteData(points) {
    const distances = [0], rawEle = [];
    const bounds = L.latLngBounds();
    for (let i = 0; i < points.length; i++) {
      bounds.extend([points[i].lat, points[i].lon]);
      rawEle.push(points[i].ele);
      if (i > 0) {
        distances.push(distances[i-1] + haversine(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon));
      }
    }
    const totalDist = distances[distances.length-1];
    const hasEle = rawEle.some(e => e != null);
    const smoothed = hasEle ? smooth(rawEle, 5) : null;
    let dPlus = 0, dMinus = 0, altMin = null, altMax = null;
    if (smoothed) {
      for (let i = 1; i < smoothed.length; i++) {
        if (smoothed[i] == null || smoothed[i-1] == null) continue;
        const d = smoothed[i] - smoothed[i-1];
        if (d > 0) dPlus += d; else dMinus += -d;
      }
      const valid = smoothed.filter(e => e != null);
      if (valid.length) { altMin = Math.min.apply(null, valid); altMax = Math.max.apply(null, valid); }
    }
    return { points, distances, elevations: smoothed,
             stats: { distance: totalDist, dPlus, dMinus, altMin, altMax }, bounds };
  }

  /* ---------- load ---------- */
  async function fetchGPXPoints(file) {
    const url = CONFIG.baseUrl + encodeURIComponent(file);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${file}`);
    return parseGPX(await resp.text());
  }

  async function loadRoute(id) {
    if (state.activeId === id && state.currentData) return;
    state.activeId = id;
    updateRouteButtons(id);

    if (state.cache[id]) { state.currentData = state.cache[id]; render(); return; }

    showLoader(true); hideError();
    try {
      const route = CONFIG.routes.find(r => r.id === id);
      if (!route) throw new Error('Parcours inconnu');
      const files = route.files || [route.file];
      const arrays = await Promise.all(files.map(fetchGPXPoints));

      let points = [];
      for (const arr of arrays) {
        if (!arr.length) continue;
        if (!points.length) { points = arr.slice(); continue; }
        const last = points[points.length-1], first = arr[0];
        const gap = haversine(last.lat, last.lon, first.lat, first.lon);
        points = points.concat(gap < 100 ? arr.slice(1) : arr);
      }
      if (!points.length) throw new Error('Aucun point dans les GPX');

      const data = computeRouteData(points);
      data.name = route.name;
      data.id = id;
      data.color = route.color || '#0068B1';
      state.cache[id] = data;

      if (state.activeId === id) { state.currentData = data; render(); }
    } catch (e) {
      console.error('[GPX]', e);
      if (state.activeId === id) { showLoader(false); showError(e.message || 'Impossible de charger le GPX.'); }
    }
  }

  /* ---------- render ---------- */
  function render() {
    if (!state.currentData) return;
    showLoader(false);
    renderMap(state.currentData);
    renderElevation(state.currentData);
    renderStats(state.currentData);
    renderSubtitle(state.currentData);
  }

  function renderMap(data) {
    Object.values(state.layers).forEach(l => { if (l && state.map.hasLayer(l)) state.map.removeLayer(l); });
    state.layers = { polyline: null, start: null, end: null, hover: null };
    const latlngs = data.points.map(p => [p.lat, p.lon]);
    const color = data.color || '#0068B1';

    state.layers.polyline = L.polyline(latlngs, {
      color, weight: 4, opacity: 0.9, lineJoin: 'round', lineCap: 'round'
    }).addTo(state.map);

    state.layers.start = L.marker(latlngs[0], { icon: L.divIcon({
      className: '', iconSize: [14,14], iconAnchor: [7,7],
      html: `<div style="width:12px;height:12px;background:#fff;border:3px solid ${color};border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`
    })}).bindTooltip('Départ', { direction: 'top', offset: [0,-8] }).addTo(state.map);

    state.layers.end = L.marker(latlngs[latlngs.length-1], { icon: L.divIcon({
      className: '', iconSize: [14,14], iconAnchor: [7,7],
      html: `<div style="width:14px;height:14px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`
    })}).bindTooltip('Arrivée', { direction: 'top', offset: [0,-8] }).addTo(state.map);

    state.layers.hover = L.circleMarker(latlngs[0], {
      radius: 6, color: '#fff', fillColor: color, fillOpacity: 1, weight: 2, opacity: 0
    }).addTo(state.map);

    state.map.fitBounds(data.bounds, { padding: [20, 20] });
  }

  function renderStats(data) {
    const s = data.stats;
    $('stat-dist').textContent   = fmt(s.distance/1000, 1) + ' km';
    $('stat-dplus').textContent  = fmt(s.dPlus, 0) + ' m';
    $('stat-altmax').textContent = s.altMax != null ? fmt(s.altMax, 0) + ' m' : '—';
    $('stat-altmin').textContent = s.altMin != null ? fmt(s.altMin, 0) + ' m' : '—';
  }
  function renderSubtitle(data) {
    const s = data.stats;
    let txt = data.name;
    if (s.distance) txt += ' · ' + fmt(s.distance/1000, 1) + ' km';
    if (s.dPlus)    txt += ' · D+ ' + fmt(s.dPlus, 0) + ' m';
    $('sl-subtitle').textContent = txt;
  }

  /* ---------- profil altimétrique ---------- */
  function renderElevation(data) {
    const svg = $('sl-elev-svg'), emptyEl = $('sl-elev-empty'), container = $('sl-elev-wrap');
    if (!data.elevations || data.stats.altMin == null) {
      svg.innerHTML = ''; svg.style.display = 'none'; emptyEl.style.display = 'flex'; return;
    }
    svg.style.display = 'block'; emptyEl.style.display = 'none';
    const W = container.clientWidth, H = container.clientHeight;
    if (W < 10 || H < 10) return;

    const color = data.color || '#0068B1';
    const pad = { top: 10, right: 16, bottom: 22, left: 12 };
    const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
    const { distances, elevations, stats } = data;
    const totalDist = distances[distances.length-1];
    if (totalDist === 0) return;

    const minE = stats.altMin, maxE = stats.altMax, eRange = (maxE-minE)||1;
    const xS = d => pad.left + (d/totalDist)*cw;
    const yS = e => pad.top + ch - ((e-minE)/eRange)*ch;

    const N = elevations.length, step = Math.max(1, Math.floor(N/1200));
    let lineParts = [], areaParts = [];
    const firstE = elevations[0] != null ? elevations[0] : minE;
    lineParts.push(`M ${xS(0).toFixed(1)} ${yS(firstE).toFixed(1)}`);
    areaParts.push(`M ${xS(0).toFixed(1)} ${(pad.top+ch).toFixed(1)} L ${xS(0).toFixed(1)} ${yS(firstE).toFixed(1)}`);
    for (let i = step; i < N; i += step) {
      const e = elevations[i] != null ? elevations[i] : minE;
      const x = xS(distances[i]).toFixed(1), y = yS(e).toFixed(1);
      lineParts.push(`L ${x} ${y}`); areaParts.push(`L ${x} ${y}`);
    }
    const lastE = elevations[N-1] != null ? elevations[N-1] : minE;
    lineParts.push(`L ${xS(totalDist).toFixed(1)} ${yS(lastE).toFixed(1)}`);
    areaParts.push(`L ${xS(totalDist).toFixed(1)} ${yS(lastE).toFixed(1)}`);
    areaParts.push(`L ${xS(totalDist).toFixed(1)} ${(pad.top+ch).toFixed(1)} Z`);

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `
      <defs><linearGradient id="sl-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
      </linearGradient></defs>
      <path d="${areaParts.join(' ')}" fill="url(#sl-grad)"/>
      <path d="${lineParts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${(pad.left+cw).toFixed(1)}" y="${H-4}" text-anchor="end"
            font-family="Merriweather Sans, sans-serif" font-size="9" font-weight="600"
            fill="#9E9E9E">${fmt(totalDist/1000,0)} km</text>
      <text x="${pad.left}" y="${H-4}" font-family="Merriweather Sans, sans-serif"
            font-size="9" font-weight="600" fill="#9E9E9E">0 km</text>
      <g id="sl-hover-g" style="display:none;pointer-events:none">
        <line id="sl-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${pad.top+ch}"
              stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
        <circle id="sl-hover-dot" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>
        <rect id="sl-hover-bg" x="0" y="0" width="100" height="16" rx="2"
              fill="${color}" opacity="0.92"/>
        <text id="sl-hover-txt" x="0" y="0" font-family="Merriweather Sans, sans-serif"
              font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">0 km · 0 m</text>
      </g>
      <rect id="sl-hover-capture" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;

    data._scales = { xS, yS, pad, cw, totalDist, W, minE };
    attachElevHover(data);
  }

  function attachElevHover(data) {
    const svg = $('sl-elev-svg'), capture = $('sl-hover-capture');
    if (!capture) return;
    const { distances, elevations, points } = data;
    const { xS, yS, pad, cw, totalDist, W, minE } = data._scales;

    function onMove(evt) {
      const rect = svg.getBoundingClientRect();
      const px = evt.clientX - rect.left;
      if (px < pad.left || px > pad.left + cw) return;
      const d = ((px - pad.left) / cw) * totalDist;
      let lo = 0, hi = distances.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (distances[mid] < d) lo = mid + 1; else hi = mid;
      }
      let idx = lo;
      if (idx > 0 && Math.abs(distances[idx-1]-d) < Math.abs(distances[idx]-d)) idx--;
      const e = elevations[idx] != null ? elevations[idx] : minE;
      const x = xS(distances[idx]), y = yS(e);
      const line=$('sl-hover-line'), dot=$('sl-hover-dot'), bg=$('sl-hover-bg'),
            txt=$('sl-hover-txt'), g=$('sl-hover-g');
      if (!g) return;
      g.style.display = 'block';
      line.setAttribute('x1', x); line.setAttribute('x2', x);
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      const label = fmt(distances[idx]/1000, 1) + ' km · ' + fmt(e, 0) + ' m';
      txt.textContent = label;
      const txtWidth = label.length * 5.5 + 16;
      let tx = x;
      if (tx - txtWidth/2 < pad.left) tx = pad.left + txtWidth/2;
      if (tx + txtWidth/2 > W - pad.right) tx = W - pad.right - txtWidth/2;
      let ty = y - 24; if (ty < 1) ty = y + 8;
      bg.setAttribute('x', tx-txtWidth/2); bg.setAttribute('y', ty);
      bg.setAttribute('width', txtWidth);
      txt.setAttribute('x', tx); txt.setAttribute('y', ty+12);
      if (state.layers.hover) {
        const pt = points[idx];
        state.layers.hover.setLatLng([pt.lat, pt.lon]);
        state.layers.hover.setStyle({ opacity: 1 });
      }
    }
    function onLeave() {
      const g = $('sl-hover-g'); if (g) g.style.display = 'none';
      if (state.layers.hover) state.layers.hover.setStyle({ opacity: 0 });
    }
    capture.addEventListener('mousemove', onMove);
    capture.addEventListener('mouseleave', onLeave);
    capture.addEventListener('touchmove', e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive:true });
    capture.addEventListener('touchend', onLeave);
  }

  /* ---------- UI helpers ---------- */
  function buildRouteButtons() {
    const c = $('sl-routes'); c.innerHTML = '';
    CONFIG.routes.forEach(r => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'sl-route';
      b.dataset.route = r.id;
      b.style.setProperty('--route-color', r.color || '#0068B1');
      b.innerHTML = `<span class="sl-route-dot"></span><span>${r.name}</span>`;
      b.addEventListener('click', () => { if (state.activeId !== r.id) loadRoute(r.id); });
      c.appendChild(b);
    });
  }
  function updateRouteButtons(id) {
    document.querySelectorAll('.sl-route').forEach(b => b.classList.toggle('active', b.dataset.route === id));
  }
  function showLoader(show) { $('sl-loader').classList.toggle('active', show); }
  function showError(msg) { $('sl-error-msg').textContent = msg; $('sl-error').classList.add('active'); }
  function hideError() { $('sl-error').classList.remove('active'); }

  /* ---------- init ---------- */
  function init() {
    state.map = L.map('sl-map', { zoomControl:false }).setView([45.75, 4.85], 9);
    L.control.zoom({ position:'topright' }).addTo(state.map);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(state.map);

    buildRouteButtons();
    if (CONFIG.routes.length) loadRoute(CONFIG.routes[0].id);

    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        state.map.invalidateSize();
        if (state.currentData) renderElevation(state.currentData);
      }, 200);
    });
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
          if (state.currentData) renderElevation(state.currentData);
        }, 120);
      });
      ro.observe($('sl-elev-wrap'));
    }
    setTimeout(() => state.map.invalidateSize(), 300);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
